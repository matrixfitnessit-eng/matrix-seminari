<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seminari Matrix – RiminiWellness 2026</title>
  <meta name="description" content="Programma completo dei seminari Matrix a RiminiWellness 2026 con registrazione multi-sessione e approfondimenti su relatori e abstract." />
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --panel-2: #1b1b1b;
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: #b8b8b8;
      --muted-2: #8f8f8f;
      --red: #c1121f;
      --red-hover: #a10f1a;
      --success: #1d7a46;
      --success-bg: rgba(29, 122, 70, 0.14);
      --radius: 22px;
      --shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background:
        radial-gradient(circle at top right, rgba(193, 18, 31, 0.22), transparent 28%),
        radial-gradient(circle at left, rgba(255,255,255,0.07), transparent 22%),
        var(--bg);
    }

    .hero-inner {
      padding: 76px 0 56px;
      max-width: 980px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }

    .badge.red {
      background: var(--red);
      border-color: transparent;
    }

    h1 {
      margin: 18px 0 16px;
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.02;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      max-width: 840px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
    }

  </div>
    
  <script>
    const GOOGLE_SHEETS_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbyZTIQI71Avm__9v4R0lnyRoiSHj4YsfHVqqWiXawOQbt5YLFwthDYNgUYg7e2wyjJj/exec';
    const STORAGE_KEY = 'matrix-seminar-registrations-html';

    const seminars = [
      { id: 1, title: 'Pagamenti invisibili, impatti concreti: la rivoluzione che il fitness non può ignorare', date: '28 maggio 2026', time: '10:30 – 11:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Business', speakers: [{ name: 'Guzzetti', role: 'Socio fondatore, UP Soluzioni', image: 'GUIZZETTI.jpg' }], abstract: 'Dimenticate i contanti: siamo nell’era della rivoluzione cashless, dove lo smartphone è il nuovo portafoglio e la Generazione Z detta le regole del gioco. Il fitness deve evolversi ora, trasformando i pagamenti digitali e ricorrenti in potenti strumenti di fidelizzazione per intercettare i nuovi desideri dei clienti. Non è solo tecnologia, è un cambio di mentalità totale: chi non adegua script di vendita e strategie commerciali a questa velocità rischia di restare invisibile.' },
      { id: 2, title: 'I numeri che contano', date: '28 maggio 2026', time: '11:30 – 12:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Palestre di Successo', speakers: [{ name: 'Claudio De Padua', role: 'Consulente Master, Palestre di Successo' }], abstract: 'I parametri fondamentali del controllo di gestione per avere le redini della propria palestra e ottenere, in modo semplice e preciso, la fotografia del club. Un approccio pragmatico per misurare, analizzare e correggere l’andamento della struttura, trasformando i dati in decisioni operative.' },
      { id: 3, title: "Il metodo corretto per implementare l'IA nella gestione del Fitness Club", date: '28 maggio 2026', time: '12:30 – 14:00', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'AI & Marketing', speakers: [{ name: 'Luca Ercolani' }, { name: 'Carmine Preziosi', role: 'Marketing Strategist', bio: 'Marketing strategist, consulente e formatore, laureato in Economia e Commercio con Master in Social Media Marketing. Da oltre vent’anni supporta aziende e professionisti nello sviluppo di strategie marketing e commerciali, in particolare nei settori fitness, wellness e medicale. È autore di manuali di marketing, docente e relatore in eventi nazionali e internazionali di settore.' }, { name: 'Maurizio Taruggi' }], abstract: 'Il seminario sarà suddiviso in tre tappe sequenziali per guidare titolari e manager nell’integrazione dell’IA. Tre moduli propedeutici per trasformare l’innovazione tecnologica dell’Intelligenza Artificiale in una concreta leva strategica di profitto e operatività.\n\n1. Il Nuovo Mindset AI (Luca Ercolani) — L’IA non è un semplice software ma un cambio di paradigma culturale.\n\n2. Marketing Strategico e Acquisizione (Carmine Preziosi) — L’IA può potenziare il marketing del club e rendere la lead generation più scalabile e profittevole.\n\n3. Conversione e Vendita Automatizzata (Maurizio Taruggi) — CRM, WhatsApp e automazioni possono essere integrati per gestire volumi elevati di contatti e aumentare le conversioni.' },
      { id: 4, title: 'Il fitness non basta più: entra nell’era della longevità', date: '28 maggio 2026', time: '14:30 – 15:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Longevity', speakers: [{ name: 'Gianluca Scazzosi' }, { name: 'Carmine Preziosi', role: 'Marketing Strategist', bio: 'Marketing strategist, consulente e formatore, laureato in Economia e Commercio con Master in Social Media Marketing. Da oltre vent’anni supporta aziende e professionisti nello sviluppo di strategie marketing e commerciali, in particolare nei settori fitness, wellness e medicale. È autore di manuali di marketing, docente e relatore in eventi nazionali e internazionali di settore.' }], abstract: 'Il modello tradizionale del fitness mostra oggi limiti evidenti, mentre cresce la domanda di salute attiva e longevità. In questo seminario viene presentato un cambio di paradigma: trasformare la palestra in un centro di longevità, capace di attrarre il target over 50 e generare maggiore valore.\n\nGianluca Scazzosi e Carmine Preziosi illustreranno le leve strategiche per acquisire nuovi clienti, aumentare la retention e creare sostenibilità del business nel nuovo scenario del fitness.' },
      { id: 5, title: 'Dal CRM all’iscrizione: come un agente AI gestisce i contatti al posto tuo', date: '28 maggio 2026', time: '15:30 – 16:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'AI & Sales', speakers: [{ name: 'Maurizio Taruggi' }], abstract: 'Da titolare di un fitness center e fondatore di una società di consulenza digitale, Maurizio Taruggi racconta il problema reale che lo ha spinto a creare SuperAgent.fit: troppi lead, troppo poco tempo, troppe opportunità perse.\n\nIn questo intervento mostrerà come un agente AI verticale per il fitness possa gestire simultaneamente comunicazioni in entrata e in uscita, inviare messaggi massivi su WhatsApp, qualificare i contatti e alimentare un CRM, il tutto senza aumentare i costi del personale.\n\nNon teoria: dati, flussi e demo dal vivo.' },
      { id: 6, title: 'Dalla prima iscrizione all’allenamento: come creare un’esperienza fluida e memorabile per l’utente del fitness', date: '28 maggio 2026', time: '16:30 – 17:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Team System', speakers: [{ name: 'Roberto Di Giacomo', role: 'Business Developer TeamSystem' }], abstract: 'Quando allenarsi è semplice, l’esperienza cresce e il business segue.\n\nOggi l’esperienza dell’utente in un centro fitness non si gioca solo sulla qualità delle attrezzature o dei trainer, ma sulla semplicità e continuità del percorso che vive, dal primo contatto fino all’allenamento in sala.\n\nIl digitale, se incontra processi ben progettati e persone preparate, può trasformare l’esperienza del cliente e diventare una leva concreta di crescita sostenibile per il business del fitness.' },
      { id: 7, title: 'Lavoro di produzione: la differenza tra segreteria e consulenza', date: '29 maggio 2026', time: '10:30 – 11:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Palestre di Successo', speakers: [{ name: 'Gianna Di Pietro', role: 'Consulente Master, Palestre di Successo', bio: 'Gianna Di Pietro lavora da 15 anni nel settore fitness. Per dieci anni è stata consulente fitness in diverse catene sul territorio napoletano. Ha lavorato per oltre 6 anni con il metodo Palestre di Successo, riscontrando nella pratica benefici concreti.\n\nNel 2020 entra in Palestre di Successo come prima dipendente; due mesi dopo scoppia il Covid. Insieme al team decide di supportare attivamente i club, aiutandoli a superare la fase critica.\n\nOggi è consulente master per oltre 100 club in tutta Italia, coordina i consulenti PDS e segue direttamente i centri nell’implementazione del metodo.' }], abstract: 'L’intervento ha come obiettivo comprendere la differenza tra la classica segreteria in palestra e la figura del consulente fitness in un centro fitness nel 2026.\n\nQuali sono i benefici per un titolare che inserisce un consulente e come, attraverso il lavoro di produzione illustrato nel dettaglio, è possibile trasformare fino all’80% degli appuntamenti in fatturato aziendale, lasciando solo al 10% la casualità dei tour spontanei.' },
      { id: 8, title: 'Power Penia e Longevity: il ruolo della forza muscolare nei modelli di prevenzione e nelle palestre della salute', date: '29 maggio 2026', time: '14:30 – 15:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Longevity & Medical Fitness', speakers: [{ name: 'Luca Marin, Ft, PhD', role: 'Università di Pavia', bio: 'Responsabile scientifico del Laboratorio per la Riabilitazione e la Chirurgia Ortopedica (LAROS) e membro del Laboratorio di Attività Motoria Adattata (LAMA), Università di Pavia. Professore a contratto presso i Corsi di Laurea di Scienze Motorie e docente del Master EAP. Autore ed editor di 6 libri sul fitness e sull’attività motoria adattata.' }, { name: 'Dott. Michele Felisatti, MSc, PhD', role: 'Esercizio Vita Medical Fitness', bio: 'CEO e Co-Founder di Esercizio Vita Medical Fitness. Professore nei corsi di Laurea in Medicina e Chirurgia e Scienze Motorie dell’Università di Ferrara e docente Master EAP Università di Pavia. Vicepresidente A.I.S.E. e membro S.I.S.M.E.S. Autore ed editor di 3 libri e oltre 20 articoli scientifici sull’attività motoria adattata.' }], abstract: 'La fisiologica perdita di potenza muscolare correlata all’avanzare degli anni rappresenta un biomarcatore critico della longevità. Questo declino, più rapido e precoce rispetto alla perdita di massa muscolare, costituisce un importante predittore di cadute, disabilità e mortalità prematura.\n\nLe evidenze scientifiche e le linee guida internazionali riconoscono l’esercizio fisico, e in particolare l’allenamento della forza, come intervento efficace nella prevenzione primaria e secondaria delle malattie croniche, oltre che nel mantenimento della capacità funzionale lungo tutto l’arco della vita.\n\nIl workshop fornirà strumenti operativi e una dimostrazione pratica di protocolli ed esercizi specifici per il potenziamento funzionale della persona anziana.' },
      { id: 9, title: 'Personalizzazione dell’allenamento e Longevity Economy: progettare centri fitness più profittevoli nell’era dei dati', date: '29 maggio 2026', time: '15:30 – 16:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Longevity & Business', speakers: [{ name: 'Salvatore Picucci', role: 'Founder WTM – Wellness Management', bio: 'Salvatore Picucci è fondatore del metodo WTM – Ingegneria Strategica del Wellness Management. Da oltre 30 anni progetta strategie di sviluppo e modelli di business per centri fitness, wellness, longevity, beauty e hotel spa, supportando imprenditori e investitori nella creazione di sistemi profittevoli e scalabili.' }], abstract: 'Il settore fitness e wellness sta entrando in una nuova fase evolutiva: la personalizzazione basata sui dati, l’integrazione tra fitness, salute e longevità e l’utilizzo di tecnologie intelligenti stanno trasformando profondamente il modello di business dei club.\n\nDurante l’intervento verrà analizzato come i sistemi di allenamento personalizzato e automatizzato possano migliorare retention, valore del cliente e redditività dei centri fitness.\n\nVerranno presentati nuovi modelli di sviluppo per fitness club, spa e wellness destination orientati alla longevity economy.' },
      { id: 10, title: 'Dai clienti agli MVP: come progettare crescita, retention e scalabilità nel fitness 2026', date: '29 maggio 2026', time: '16:30 – 17:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Les Mills', speakers: [{ name: 'Marco Meli', role: 'National Business Development Manager, Les Mills Italia', bio: 'National Business Development Manager per Les Mills Italia, collabora con i club italiani per ottimizzare le operazioni, esplorare nuove opportunità e rimanere all’avanguardia del mercato.' }], abstract: 'Il fitness cresce, ma i margini no. Perché?\n\nOggi il vero problema non è portare più clienti, ma creare quelli giusti: gli MVP (Most Valuable Participants), i membri che frequentano di più, restano più a lungo e fanno crescere davvero il business.\n\nPartendo dalle ricerche Les Mills su milioni di percorsi reali, vedremo cosa funziona oggi nei club e perché molti modelli non reggono più. Dalle mode alla costruzione di abitudini, fino a come rendere tutto replicabile e controllabile: dalla sala corsi alla sala pesi, dai sistemi come EGYM al pilotaggio manageriale con Heitz.\n\nPerché oggi non vince chi aggiunge servizi.\nVince chi costruisce un sistema che funziona davvero.' },
      { id: 11, title: 'Cross Cardio Experience', subtitle: 'Il metodo che rivoluziona l’allenamento in sala fitness', date: '30 maggio 2026', time: '15:30 – 16:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Training & Performance', speakers: [{ name: 'Jairo Junior', role: 'Founder Cross Cardio' }, { name: 'Daniele Magliola', role: 'Master Trainer' }, { name: 'Simone Magliola', role: 'Presenter & Trainer' }, { name: 'Enzo Ferrari', role: 'Maestro di Cultura Fisica' }], abstract: 'Un’esperienza formativa e pratica che porta sul palco il metodo Cross Cardio: un approccio rivoluzionario all’allenamento che integra mobilità, intensità e funzionalità per risultati concreti. (Titolo e contenuti in aggiornamento)' },
      { id: 12, title: 'FunXtional Body Building: trasforma la tua sala pesi in un sistema che produce risultati e valore', date: '31 maggio 2026', time: '11:30 – 12:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Training & Performance', speakers: [{ name: 'Jairo Junior', role: 'Founder Cross Cardio', bio: 'Fitness Legend e laureato in Fisioterapia, è un’icona internazionale del fitness e presenter a Rimini Wellness dal 1999. Fondatore di Cross Cardio e Mobility, ha rivoluzionato l’allenamento in sala fitness con risultati concreti. Formatore di migliaia di trainer, collabora con brand globali ed è trainer Virgin Active.' }, { name: 'Daniele Magliola', role: 'Master Trainer', bio: 'Master Trainer laureato in Scienze Motorie e manager fitness, scopre Cross Cardio nel 2015 a Rimini Wellness. Da subito coinvolto nel progetto, diventa uno dei massimi esperti del metodo. Oggi forma trainer e diffonde il Cross Cardio in Italia e nel mondo.' }, { name: 'Simone Magliola', role: 'Presenter & Trainer', bio: 'Laureato in Scienze Motorie e imprenditore fitness, incontra Cross Cardio nel 2015 durante il lancio ufficiale. Dal 2016 è Presenter e Formatore, contribuendo alla crescita del metodo a livello internazionale.' }, { name: 'Enzo Ferrari', role: 'Maestro di Cultura Fisica', bio: 'Figura storica del bodybuilding italiano con oltre 40 anni di esperienza, è pluricampione IFBB e Maestro di Cultura Fisica. Formatore e mentore, ha dedicato la sua carriera allo sviluppo di forza e ipertrofia.' }], abstract: 'Oggi la sala pesi tradizionale fatica a coinvolgere, fidelizzare e generare reale valore per il cliente. Allenamenti ripetitivi, scarsa guida e poca struttura portano a risultati limitati e abbandono.\n\nIl FunXtional Body Building nasce per risolvere questo problema: un metodo evoluto che integra i principi del bodybuilding con la logica funzionale, creando sessioni strutturate, coinvolgenti e altamente efficaci.\n\nAttraverso una programmazione basata su stimoli neurali, meccanici e metabolici, il metodo permette di sviluppare forza, ipertrofia e controllo motorio utilizzando in modo strategico le macchine e gli attrezzi della sala pesi Matrix.\n\nIl risultato è un’esperienza di allenamento guidata, progressiva e replicabile, che aumenta la qualità del servizio, migliora la percezione del trainer e trasforma la sala pesi in un vero centro di performance.\n\nDurante il seminario verrà presentata l’applicazione concreta del metodo, seguita da una sessione pratica in sala in cui i partecipanti potranno testare direttamente l’efficacia del sistema utilizzando le attrezzature Matrix.\n\nPiù risultati per i clienti. Più valore per il tuo club.\nStrength is the new fit.' },
      { id: 13, title: 'La riumanizzazione del fitness: camminata, corsa e ritorno alla natura umana', date: '30 maggio 2026', time: '14:30 – 15:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Correre Naturale', speakers: [{ name: 'Daniele Vecchioni', role: 'Founder Correre Naturale' }], abstract: 'Un talk che cambierà il modo in cui guardi il movimento umano.\n\nViviamo in un\'epoca in cui le persone cercano salute, performance e benessere, ma con un corpo che non è più pronto a muoversi secondo natura.\n\nNel mondo delle palestre, la vera sfida non è far allenare le persone, ma aiutarle a diventare esseri umani che possono allenarsi.\n\nScoprirai:\n- Perché camminare e correre nel modo corretto sono strumenti potenti di acquisizione clienti\n- Come creare percorsi di trasformazione reali che aumentano la retention\n- I 3 pilastri del benessere: Software, Hardware e Training\n- Il concetto di fitness umano e perché sta cambiando il settore\n\nIn un mercato saturo, vince chi si distingue con valore, autenticità ed esperienza.' },
      { id: 14, title: 'Quadrante Inferiore: Anatomia descrittiva e funzionale – Squat e Leg Extension', date: '30 maggio 2026', time: '10:30 – 12:00', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Training & Biomeccanica', speakers: [{ name: 'Giuseppe Zinno', role: 'Master Trainer' }, { name: 'Marco Montanino', role: 'Fisioterapista e Osteopata' }, { name: 'Generoso Cristantelli', role: 'Preparatore Fisico' }], abstract: 'Seminario pratico dedicato all’analisi biomeccanica e funzionale del quadrante inferiore. Focus su squat e leg extension con approfondimenti su tecnica, attivazione muscolare e prevenzione degli infortuni. (Abstract in aggiornamento)' },
      { id: 15, title: 'Quadrante Superiore: Anatomia descrittiva e funzionale – Allenare Petto e Dorso', date: '30 maggio 2026', time: '12:00 – 13:30', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Training & Biomeccanica', speakers: [{ name: 'Giuseppe Zinno' }, { name: 'Marco Montanino' }, { name: 'Generoso Cristantelli' }], abstract: 'Approfondimento tecnico sull’allenamento del quadrante superiore con focus su petto e dorso. Analisi funzionale, biomeccanica e applicazioni pratiche per migliorare performance ed efficacia dell’allenamento. (Abstract in aggiornamento)' },
      { id: 16, title: 'Valorizza il tuo Cardio con Sprint 8GX', date: '30 maggio 2026', time: '16:30 – 17:15', area: 'Stand Matrix - Educational Lounge - Pad. B1', category: 'Cardio & Performance', speakers: [{ name: 'Marchesan', role: 'Relatore', bio: 'Informazioni in aggiornamento.' }], abstract: 'Seminario dedicato alle strategie per valorizzare l’area cardio e aumentare il coinvolgimento degli utenti attraverso protocolli ad alta intensità e soluzioni innovative come Sprint 8GX. (Abstract in aggiornamento)' }
    ];

    const categories = ['Tutti', ...new Set(seminars.map(s => s.category))];

    const state = {
      search: '',
      category: 'Tutti',
      selectedSeminarIds: [],
      registrations: JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')
    };

    const filtersEl = document.getElementById('filters');
    const gridEl = document.getElementById('seminarsGrid');
    const pickerEl = document.getElementById('seminarPicker');
    const searchInput = document.getElementById('searchInput');
    const registrationCount = document.getElementById('registrationCount');
    const selectedBox = document.getElementById('selectedBox');
    const submitBtn = document.getElementById('submitBtn');
    const successAlert = document.getElementById('successAlert');
    const form = document.getElementById('registrationForm');
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modalContent');
    const modalClose = document.getElementById('modalClose');
    const downloadCsvBtn = document.getElementById('downloadCsvBtn');

    function parseDay(dateStr) {
      return parseInt(dateStr.split(' ')[0], 10);
    }

    function parseTimeValue(timeStr) {
      return timeStr.split('–')[0].trim();
    }

    function getFilteredSeminars() {
      return seminars
        .filter(seminar => {
          const q = state.search.trim().toLowerCase();
          const subtitle = (seminar.subtitle || '').toLowerCase();
          const matchesSearch = !q ||
            seminar.title.toLowerCase().includes(q) ||
            subtitle.includes(q) ||
            seminar.category.toLowerCase().includes(q) ||
            seminar.speakers.some(s => s.name.toLowerCase().includes(q));
          const matchesCategory = state.category === 'Tutti' || seminar.category === state.category;
          return matchesSearch && matchesCategory;
        })
        .sort((a, b) => {
          const dateDiff = parseDay(a.date) - parseDay(b.date);
          if (dateDiff !== 0) return dateDiff;
          return parseTimeValue(a.time).localeCompare(parseTimeValue(b.time));
        });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderFilters() {
      filtersEl.innerHTML = categories.map(category => `
        <button class="chip ${state.category === category ? 'active' : ''}" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>
      `).join('');
      filtersEl.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          state.category = btn.dataset.category;
          renderFilters();
          renderGrid();
        });
      });
    }

    function renderGrid() {
      const filtered = getFilteredSeminars();
      document.getElementById('hero-count').textContent = `${filtered.length} seminari`;
      gridEl.innerHTML = filtered.map(seminar => `
        <article class="card">
          <div class="card-body">
            <div class="topline">
              <span class="badge">${escapeHtml(seminar.category)}</span>
              <span class="small muted">#${seminar.id}</span>
            </div>
            <h3 class="seminar-title">${escapeHtml(seminar.title)}</h3>
            ${seminar.subtitle ? `<p class="muted small">${escapeHtml(seminar.subtitle)}</p>` : ''}
            <div class="meta-list">
              <div>${escapeHtml(seminar.date)}</div>
              <div>${escapeHtml(seminar.time)}</div>
              <div>${escapeHtml(seminar.area)}</div>
              <div>${escapeHtml(seminar.speakers.map(s => s.name).join(', '))}</div>
            </div>
            <div class="abstract-preview">${escapeHtml(seminar.abstract)}</div>
            <div class="actions">
              <button class="btn btn-primary" data-details="${seminar.id}">Scopri di più</button>
              <button class="btn btn-secondary" data-add="${seminar.id}">Aggiungi</button>
            </div>
          </div>
        </article>
      `).join('');

      gridEl.querySelectorAll('[data-details]').forEach(btn => {
        btn.addEventListener('click', () => openModal(Number(btn.dataset.details)));
      });

      gridEl.querySelectorAll('[data-add]').forEach(btn => {
        btn.addEventListener('click', () => {
          addSeminar(Number(btn.dataset.add));
          document.getElementById('registration-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    function renderPicker() {
      const sorted = seminars.slice().sort((a, b) => {
        const dateDiff = parseDay(a.date) - parseDay(b.date);
        if (dateDiff !== 0) return dateDiff;
        return parseTimeValue(a.time).localeCompare(parseTimeValue(b.time));
      });

      pickerEl.innerHTML = sorted.map(seminar => {
        const checked = state.selectedSeminarIds.includes(String(seminar.id));
        return `
          <label class="option">
            <input type="checkbox" value="${seminar.id}" ${checked ? 'checked' : ''}>
            <div>
              <div class="option-title">${escapeHtml(seminar.title)}</div>
              <div class="option-meta">${escapeHtml(seminar.date)} · ${escapeHtml(seminar.time)}</div>
            </div>
          </label>
        `;
      }).join('');

      pickerEl.querySelectorAll('input[type="checkbox"]').forEach(input => {
        input.addEventListener('change', () => toggleSeminarSelection(input.value));
      });

      renderSelectedBox();
    }

    function renderSelectedBox() {
      const selected = seminars.filter(seminar => state.selectedSeminarIds.includes(String(seminar.id)));
      if (!selected.length) {
        selectedBox.style.display = 'none';
        submitBtn.disabled = true;
        return;
      }

      selectedBox.style.display = 'block';
      selectedBox.innerHTML = `
        <div><strong style="color:#fff;">Selezionati (${selected.length})</strong></div>
        <div class="selected-tags">
          ${selected.map(seminar => `<span class="badge red">${escapeHtml(seminar.time)} · ${escapeHtml(seminar.title)}</span>`).join('')}
        </div>
      `;
      submitBtn.disabled = false;
    }

    function toggleSeminarSelection(id) {
      const strId = String(id);
      if (state.selectedSeminarIds.includes(strId)) {
        state.selectedSeminarIds = state.selectedSeminarIds.filter(item => item !== strId);
      } else {
        state.selectedSeminarIds.push(strId);
      }
      renderPicker();
    }

    function addSeminar(id) {
      const strId = String(id);
      if (!state.selectedSeminarIds.includes(strId)) {
        state.selectedSeminarIds.push(strId);
        renderPicker();
      }
    }

    function openModal(id) {
      const seminar = seminars.find(item => item.id === id);
      if (!seminar) return;

      modalContent.innerHTML = `
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
          <span class="badge red">${escapeHtml(seminar.category)}</span>
          <span class="badge">${escapeHtml(seminar.date)}</span>
        </div>
        <h2 style="font-size:32px; line-height:1.08; margin:0 0 8px;">${escapeHtml(seminar.title)}</h2>
        <p class="muted" style="margin:0 0 18px;">${escapeHtml(seminar.time)} · ${escapeHtml(seminar.area)}</p>
        ${seminar.subtitle ? `<div style="margin-bottom:18px;"><div class="small muted" style="text-transform:uppercase; letter-spacing:.16em; margin-bottom:6px;">Focus</div><div>${escapeHtml(seminar.subtitle)}</div></div>` : ''}
        <div style="margin-bottom:18px;">
          <div class="small muted" style="text-transform:uppercase; letter-spacing:.16em; margin-bottom:6px;">Abstract</div>
          <div style="white-space:pre-line;">${escapeHtml(seminar.abstract)}</div>
        </div>
        <div>
          <div class="small muted" style="text-transform:uppercase; letter-spacing:.16em; margin-bottom:10px;">Relatori</div>
          ${seminar.speakers.map(speaker => `
            <div class="speaker">
              ${speaker.image ? `<img src="${escapeHtml(speaker.image)}" alt="${escapeHtml(speaker.name)}" onerror="this.style.display='none'" />` : ''}
              <div style="font-weight:700;">${escapeHtml(speaker.name)}</div>
              ${speaker.role ? `<div class="muted small" style="margin-top:4px;">${escapeHtml(speaker.role)}</div>` : ''}
              ${speaker.bio ? `<div class="muted" style="margin-top:12px; white-space:pre-line;">${escapeHtml(speaker.bio)}</div>` : ''}
            </div>
          `).join('')}
        </div>
        <div style="margin-top:18px;">
          <button class="btn btn-primary" id="modalAddBtn">Aggiungi alla registrazione</button>
        </div>
      `;
      modal.classList.add('open');
      document.getElementById('modalAddBtn').addEventListener('click', () => {
        addSeminar(id);
        modal.classList.remove('open');
        document.getElementById('registration-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    async function sendRowsToGoogleSheets(rows) {
      if (!GOOGLE_SHEETS_WEBHOOK_URL || GOOGLE_SHEETS_WEBHOOK_URL.includes('INCOLLA_QUI')) return;

      await fetch(GOOGLE_SHEETS_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ rows })
      });
    }

    function saveRegistrations() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.registrations));
      registrationCount.textContent = state.registrations.length;
    }

    function downloadCsv() {
      if (!state.registrations.length) return;

      const headers = ['Nome', 'Cognome', 'Telefono', 'Email', 'Città', 'Categoria', 'Seminario', 'Data', 'Orario', 'Registrazione'];
      const rows = state.registrations.map(item => [
        item.firstName, item.lastName, item.phone, item.email, item.city, item.userCategory,
        item.seminarTitle, item.seminarDate, item.seminarTime, item.createdAt
      ]);

      const csv = [headers, ...rows]
        .map(row => row.map(value => `"${String(value ?? '').replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'iscrizioni-seminari-matrix.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    searchInput.addEventListener('input', () => {
      state.search = searchInput.value;
      renderGrid();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!state.selectedSeminarIds.length) return;

      const selected = seminars.filter(seminar => state.selectedSeminarIds.includes(String(seminar.id)));
      const formData = new FormData(form);

      const rows = selected.map(seminar => ({
        firstName: formData.get('firstName') || document.getElementById('firstName').value,
        lastName: formData.get('lastName') || document.getElementById('lastName').value,
        phone: formData.get('phone') || document.getElementById('phone').value,
        email: formData.get('email') || document.getElementById('email').value,
        city: formData.get('city') || document.getElementById('city').value,
        userCategory: document.getElementById('userCategory').value,
        seminarId: String(seminar.id),
        seminarTitle: seminar.title,
        seminarDate: seminar.date,
        seminarTime: seminar.time,
        createdAt: new Date().toLocaleString('it-IT')
      }));

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Invio in corso...';
        await sendRowsToGoogleSheets(rows);
        state.registrations = [...rows, ...state.registrations];
        saveRegistrations();
        form.reset();
        state.selectedSeminarIds = [];
        renderPicker();
        successAlert.style.display = 'block';
        setTimeout(() => successAlert.style.display = 'none', 2500);
      } catch (err) {
        console.error(err);
        alert('Invio non riuscito. Verifica URL Google Apps Script e riprova.');
      } finally {
        submitBtn.textContent = 'Conferma iscrizione';
        submitBtn.disabled = !state.selectedSeminarIds.length;
      }
    });

    modalClose.addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });

    downloadCsvBtn.addEventListener('click', downloadCsv);

    registrationCount.textContent = state.registrations.length;
    renderFilters();
    renderGrid();
    renderPicker();
  </script>
</body>
</html>
